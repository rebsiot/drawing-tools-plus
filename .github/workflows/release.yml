name: Publish beta GitHub Release
on:
  push:
    tags: ['v*']
    branches: ['beta/v*']
permissions:
  contents: write
jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check version and release notes
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          else
            test "$GITHUB_REF_NAME" = "beta/v$version"
          fi
          test -s "docs/releases/v$version.md"
      - name: JavaScript checks and unit tests
        run: |
          node --check scripts/main.js
          node --check scripts/model.js
          node --check scripts/tutorial.js
          node --check scripts/selection.js
          node --check scripts/annotations.js
          npm test
      - name: Package module
        run: python3 tools/build_release.py
      - name: Publish GitHub beta release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; refusing to replace published ZIP."
            exit 1
          fi
          gh release create "$tag" "dist/foundry-drawing-quickbar-$version.zip" "module.json" \
            --target "$GITHUB_SHA" \
            --title "Drawing Tools+ v$version (Beta)" \
            --notes-file "docs/releases/v$version.md" \
            --prerelease
